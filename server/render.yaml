services:
  - type: web
    name: caption-crow-server
    env: docker
    rootDir: server          # tells Render to treat server/ as the build root
    dockerfilePath: ./Dockerfile
    plan: free               # upgrade to 'starter' if video jobs exceed 30s
    region: singapore

    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false          # paste in Render dashboard
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_APP_PASSWORD
        sync: false
